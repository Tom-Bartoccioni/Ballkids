services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ballkids-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ballkids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_data:
